#gaz{right:22px; bottom:118px}
#frein{right:22px}
.pedale.actif, #manette.actif{background:rgba(255,210,60,.38)}
body.tactile #manette{display:block} body.tactile .pedale{display:flex} body.tactile #aide{bottom:auto; top:50%}
#charge{position:fixed; inset:0; background:#16202a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center}

#barre b{display:block; height:100%; width:4%; background:var(--accent); transition:width .3s}
#credit{position:fixed; right:10px; bottom:6px; font-size:10.5px; opacity:.7; text-shadow:0 1px 3px var(--ombre); pointer-events:none}

  else if (gaz > 0) S.v += (S.v < 0 ? 20 : 8.5 * (1 - S.v / VMAX)) * dt;
  else if (gaz < 0) S.v -= (S.v > 0.5 ? 18 : 5) * dt;

// noms de rue : index spatial des tronçons
const CELL = 60, idx = new Map();
M.roads.forEach(([pts, k, n]) => { if (n < 0) return; for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], key = ((a[0] + b[0]) / 2 / CELL | 0) + '_' + ((a[1] + b[1]) / 2 / CELL | 0); if (!idx.has(key)) idx.set(key, []); idx.get(key).push([a[0], a[1], b[0], b[1], n]); } });
function rueProche() { let best = 18, nom = -1; const ci = S.x / CELL | 0, cj = S.y / CELL | 0;
  for (let i = ci - 1; i <= ci + 1; i++) for (let j = cj - 1; j <= cj + 1; j++) for (const s of (idx.get(i + '_' + j) || [])) {

const maj = s => s.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()).replace(/\b(De|Du|Des|La|Le|Les|D|L|Et|Aux|Au)\b/g, m => m.toLowerCase()).replace(/^./, m => m.toUpperCase());
const mini = el('mini').getContext('2d');
function carte() { const R = 132, sc = R / 170, a = S.camCap - Math.PI / 2;

  mini.fillStyle = 'rgba(28,38,46,.88)'; mini.fillRect(0, 0, 264, 264);

  for (const pass of [1, 2]) for (const [pts, k] of M.roads) { if (k !== pass) continue; const p0 = pts[0]; if (Math.abs(p0[0] - S.x) > 330 || Math.abs(p0[1] - S.y) > 330) continue;
    mini.beginPath(); mini.moveTo(pts[0][0], pts[0][1]); for (let q = 1; q < pts.length; q++) mini.lineTo(pts[q][0], pts[q][1]);

function taille() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 78 : 62; camera.updateProjectionMatrix(); }
addEventListener('resize', taille); taille();
const V3 = (x, y, z) => new THREE.Vector3(x - H2, z, -(y - H2));
let t0 = performance.now(), n = 0, nomAff = -2;
function boucle(t) {

  const cx = Math.cos(S.cap), cy = Math.sin(S.cap), zb = sol(S.x, S.y);

  sky.position.copy(camera.position); monts.position.set(camera.position.x, camera.position.y - 0.08, camera.position.z);
  if (OMBRES) { const q = 260 / 256, tx = Math.round(car.position.x / q) * q, tz = Math.round(car.position.z / q) * q; sun.target.position.set(tx, car.position.y, tz); sun.position.set(tx + SD.x * 1500, car.position.y + SD.y * 1500, tz + SD.z * 1500); }
  else sun.position.copy(SD).multiplyScalar(1000);

  if (n % 12 === 0) { const nm = rueProche(); if (nm !== nomAff) { nomAff = nm; el('rue').textContent = nm >= 0 ? maj(M.names[nm]) : ''; } }
}
el('charge').style.display = 'none'; canvas.focus(); canvas.addEventListener('pointerdown', () => canvas.focus());
requestAnimationFrame(boucle);
