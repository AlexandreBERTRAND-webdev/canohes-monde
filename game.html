<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Canohès, balade libre</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  /* Mise en page : le jeu occupe tout l'écran ; infos en haut, commandes tactiles en bas. Thème unique, choisi pour le jeu. */
  --encre:#ffffff; --ombre:rgba(0,0,0,.72); --panneau:rgba(22,30,38,.78); --trait:rgba(255,255,255,.9); --accent:#ffd23c;
  --titre:"Anton", Impact, "Arial Narrow", sans-serif; --texte:system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;

  --bas:clamp(28px, 22dvh, 260px); --cote:clamp(22px, 5vw, 90px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; height:100dvh; margin:0; background:#9cc4e4; overflow:hidden; color:var(--encre); font-family:var(--texte); user-select:none; -webkit-user-select:none; touch-action:none}
canvas#gl{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none}
#mini{position:fixed; left:14px; top:14px; width:132px; height:132px; border-radius:50%; box-shadow:0 0 0 3px var(--trait), 0 4px 14px rgba(0,0,0,.45)}
#infos{position:fixed; right:14px; top:12px; text-align:right; text-shadow:0 2px 6px var(--ombre); pointer-events:none}
#rue{font-family:var(--titre); font-size:clamp(20px,4.6vw,34px); line-height:1.1; letter-spacing:.02em}
#ville{font-family:var(--titre); font-size:13px; letter-spacing:.34em; opacity:.92; margin-top:3px}
#vit{font-family:var(--titre); font-size:clamp(26px,6vw,40px); margin-top:8px; font-variant-numeric:tabular-nums}
#vit small{font-size:.45em; letter-spacing:.08em; margin-left:5px}
#retour{position:fixed; left:14px; top:160px; font:600 13px var(--texte); color:var(--encre); background:var(--panneau); border:1px solid rgba(255,255,255,.35); border-radius:9px; padding:8px 11px; cursor:pointer}
#retour:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#lieu{position:fixed; left:50%; top:14px; transform:translateX(-50%); max-width:calc(100% - 340px); background:var(--panneau); border-radius:10px; padding:7px 14px; text-align:center; opacity:0; transition:opacity .4s; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#lieu.vu{opacity:1; pointer-events:auto} #lieu a{display:inline-block; margin-top:5px; font-size:12.5px; color:var(--accent); text-decoration:underline; text-underline-offset:3px} #lieu a:focus-visible{outline:2px solid var(--accent); outline-offset:2px} #lieu b{font-family:var(--titre); font-weight:400; font-size:21px; letter-spacing:.02em} #lieu small{display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.85}
@media (max-width:640px){ #lieu{top:auto; bottom:calc(var(--bas) + 200px); max-width:calc(100% - 32px)} }
#aide{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:var(--panneau); border-radius:10px; padding:8px 14px; font-size:13.5px; text-align:center; max-width:calc(100% - 32px); pointer-events:none; transition:opacity .6s}
.pedale{position:fixed; bottom:calc(var(--bas) + env(safe-area-inset-bottom)); width:84px; height:84px; border-radius:18px; background:rgba(22,30,38,.5); border:2px solid rgba(255,255,255,.55); color:var(--encre); font:700 30px var(--texte); display:none; align-items:center; justify-content:center; touch-action:none}
/* Direction : deux boutons à gauche, en miroir des pédales à droite. */
#gauche{left:calc(var(--cote) + env(safe-area-inset-left))}
#droite{left:calc(var(--cote) + 96px + env(safe-area-inset-left))}
#gaz{right:calc(var(--cote) + env(safe-area-inset-right)); bottom:calc(var(--bas) + 96px + env(safe-area-inset-bottom))}
#frein{right:calc(var(--cote) + env(safe-area-inset-right))}
.pedale.actif{background:rgba(255,210,60,.38)}
body.tactile .pedale{display:flex} body.tactile #aide{bottom:auto; top:50%}
#charge{position:fixed; inset:0; background:#16202a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center}
#charge h1{font-family:var(--titre); font-weight:400; font-size:clamp(44px,12vw,96px); letter-spacing:.07em; margin:0; line-height:1}
#charge p{margin:0; opacity:.85; font-size:15px}
#barre{width:min(320px,70vw); height:6px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden}
#barre b{display:block; height:100%; width:4%; background:var(--accent); transition:width .3s}
#credit{position:fixed; right:10px; bottom:6px; font-size:10.5px; opacity:.7; text-shadow:0 1px 3px var(--ombre); pointer-events:none}
body.tactile #credit{display:none}
</style>
</head>

<button class="pedale" id="droite" type="button" aria-label="Tourner à droite">▶</button>
<button class="pedale" id="gaz" type="button" aria-label="Accélérer">▲</button>
<button class="pedale" id="frein" type="button" aria-label="Freiner ou reculer">▼</button>
