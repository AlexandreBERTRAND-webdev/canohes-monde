name: Zone
# Appelé par chaque dépôt canohes-blocs-K : calcule les blocs de la zone K sur 16 machines et les publie sur GitHub Pages.
on:
  workflow_call:
    inputs:
      zone: { type: number, required: true }
      paquets: { type: number, default: 16 }
      blocs: { type: string, default: "" }          # reprise : seulement ces blocs (ix_iy séparés par des espaces)
      precedent: { type: string, default: "" }      # reprise : numéros des calculs précédents dont on garde les blocs, du plus ancien au plus récent
jobs:
  communs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: AlexandreBERTRAND-webdev/canohes-monde }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python prep_dept.py communs
      - uses: actions/upload-artifact@v4
        with: { name: communs, path: communs, retention-days: 3 }
      - id: m
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          b = os.environ["B"].split() or json.load(open("dept/zones.json"))["listes"][int(os.environ["Z"]) - 1]; n = max(1, min(int(os.environ["N"]), len(b)))
          print("paquets=" + json.dumps([" ".join(b[k::n]) for k in range(n)]))
          PY
        env: { Z: "${{ inputs.zone }}", N: "${{ inputs.paquets }}", B: "${{ inputs.blocs }}" }
    outputs:
      paquets: ${{ steps.m.outputs.paquets }}
  calcul:
    needs: communs
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        paquet: ${{ fromJson(needs.communs.outputs.paquets) }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: AlexandreBERTRAND-webdev/canohes-monde }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: communs, path: communs }
      - name: Blocs
        run: |
          mkdir -p sortie journaux
          for b in $PAQUET; do
            ix=${b%_*}; iy=${b#*_}
            T=$(date +%s)
            ( DONNEES=$RUNNER_TEMP/d_$b python prep_bloc.py communs $ix $iy \
              && DONNEES=$RUNNER_TEMP/d_$b SORTIE=$RUNNER_TEMP/r_$b GAME=1 BLOC=1 python video_world.py \
              && SORTIE=$RUNNER_TEMP/r_$b python export_bloc.py sortie $ix $iy ) > journaux/$b.txt 2>&1 \
              && echo "$b OK $(( $(date +%s) - T )) s" || { echo "$b ECHEC"; tail -25 journaux/$b.txt; }
            rm -rf $RUNNER_TEMP/d_$b $RUNNER_TEMP/r_$b
          done
        env: { PAQUET: "${{ matrix.paquet }}" }
      - id: nom
        run: echo "n=$(echo "$PAQUET" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        env: { PAQUET: "${{ matrix.paquet }}" }
      - uses: actions/upload-artifact@v4
        with: { name: "blocs-${{ steps.nom.outputs.n }}", path: sortie, retention-days: 10 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "journaux-${{ steps.nom.outputs.n }}", path: journaux, retention-days: 10 }
  publier:
    needs: calcul
    if: ${{ !cancelled() }}                         # jamais après un arrêt : on ne publie pas un site incomplet
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - name: Blocs des calculs précédents (du plus ancien au plus récent)
        if: inputs.precedent != ''
        run: |
          mkdir -p site
          for id in $PRECEDENT; do
            gh run download "$id" -R "$REPO" -p 'blocs-*' -D "$RUNNER_TEMP/prec_$id"
            for d in "$RUNNER_TEMP/prec_$id"/*/; do cp -r "$d". site/; done
          done
          ls site | wc -l
        env: { GH_TOKEN: "${{ github.token }}", PRECEDENT: "${{ inputs.precedent }}", REPO: "${{ github.repository }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "blocs-*", merge-multiple: true, path: site }
      - run: touch site/.nojekyll && ls site | wc -l && du -sh site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
